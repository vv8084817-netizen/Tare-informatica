<!DOCTYPE html>
<html>
    <head>
         <title> Control de asistencias</title>
 <link rel="stylesheet" href="styles.css">

 <!-- AÑADIDO: librería para generar códigos QR -->
 <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    </head>
    <body>

         <h1>Control de asistencias</h1>
         <p>Bienvenido al sistema de registro estudiantil</p>
<div class="card">
         <h2>Lector de QR</h2>

    <p>Aquí estará el lector de códigos QR.</p>
</div>
<div class="card">
    <h2>Registrar estudiante</h2>

    <!-- AÑADIDO: id="form-registro" -->
    <form id="form-registro">
        <label>Nombre:</label>

        <!-- AÑADIDO: id="nombre" -->
        <input type="text" id="nombre">

        <br><br>

        <label>Apellido:</label>

        <!-- AÑADIDO: id="apellido" -->
        <input type="text" id="apellido">

        <br><br>

        <label>Código:</label>

        <!-- AÑADIDO: id="codigo" -->
        <input type="text" id="codigo">

        <br><br>

        <!-- AÑADIDO: espacio para mensajes de error/éxito -->
        <p id="mensaje"></p>

        <br><br>

        <button type="submit">Registrar estudiante</button>

    </form>
</div>

<div class="card">

    <h2>Estudiantes registrados</h2>

    <!-- AÑADIDO: id="tabla-estudiantes" -->
    <table border="1" id="tabla-estudiantes">

        <tr>

            <th>Código</th>

            <th>Nombre</th>

            <th>Apellido</th>

            <!-- AÑADIDO: columna del QR -->
            <th>QR</th>

        </tr>

        <tr>

            <td>001</td>

            <td>Juan</td>

            <td>Pérez</td>

            <!-- AÑADIDO: celda donde se dibuja el QR de Juan -->
            <td></td>

        </tr>

    </table>
</div>

<div class="card">
<h2>Historial de asistencia</h2>

    <table border="1">

        <tr>

            <th>Estudiante</th>

            <th>Fecha</th>

            <th>Hora</th>

        </tr>

        <tr>

            <td>Juan Pérez</td>

            <td>05/10/2026</td>

            <td>7:00 AM</td>
            </tr>
            </table>
          </div>

    <!-- AÑADIDO: archivo con la lógica (QR y validación de código único) -->
    <script src="js/app.js"></script>

    </body>
</html>
