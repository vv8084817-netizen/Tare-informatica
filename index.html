<!DOCTYPE html>
<html>
    <head>
         <title> Control de asistencias</title>
 <link rel="stylesheet" href="styles.css">


    </head>
    <body>

         <h1>Control de asistencias</h1>
         <p>Bienvenido al sistema de registro estudiantil</p>
<div class="card">
         <h2>Lector de QR</h2>

    <p>Aquí estará el lector de códigos QR.</p>
</div>
<div class="card">
    <h2>Registrar estudiante</h2>

    <form>
        <label>Nombre:</label>

        <input type="text">

        <br><br>

        <label>Apellido:</label>

        <input type="text">

        <br><br>

        <label>Código:</label>

        <input type="text">

        <br><br>

        

        <br><br>

        <button type="submit">Registrar estudiante</button>

    </form>
</div>

<div class="card">

    <h2>Estudiantes registrados</h2>

    <table border="1">

        <tr>

            <th>Código</th>

            <th>Nombre</th>

            <th>Apellido</th>

         

        </tr>

        <tr>

            <td>001</td>

            <td>Juan</td>

            <td>Pérez</td>

            

        </tr>

    </table>
</div>

<div class="card">
<h2>Historial de asistencia</h2>

    <table border="1">

        <tr>

            <th>Estudiante</th>

            <th>Fecha</th>

            <th>Hora</th>

        </tr>

        <tr>

            <td>Juan Pérez</td>

            <td>05/10/2026</td>

            <td>7:00 AM</td>
            </tr>
            </table>
          </div>
         
    </body>
</html>
